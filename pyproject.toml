[project]
name = "growth-mentor"
version = "0.1.0"
description = "成长导师：会记住你、每天对账、每周复盘的 AI 导师（本机单人版）"
requires-python = ">=3.12"
dependencies = [
    "daily-planner",
    "fastapi>=0.162.7",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
    "nicegui>=4.0.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"

[tool.uv.sources]
daily-planner = { path = "planner", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
